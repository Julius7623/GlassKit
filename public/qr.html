<style>
/* Slider segmented control (same feel as the dark mode switch) */
.seg{--n:3;position:relative;display:flex;padding:4px;border-radius:999px;background:rgba(127,127,127,.16);margin-bottom:16px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.14)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.08);translate:var(--x,calc(var(--i,0)*100%)) 0;scale:1;transition:translate .55s var(--spring),scale .45s var(--spring),box-shadow .3s;pointer-events:none;will-change:translate,scale}
.seg.press .thumb{scale:1.05 1.14;box-shadow:0 8px 18px rgba(0,0,0,.26),0 0 0 .5px rgba(0,0,0,.08)}
.seg.drag .thumb{transition:scale .45s var(--spring),box-shadow .3s}
[data-theme=dark] .seg .thumb{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.4)}
[data-theme=dark] .seg.press .thumb{box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.5)}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;min-height:36px;padding:0 8px;border:0;border-radius:999px;background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--t2);white-space:nowrap;cursor:pointer;transition:color .3s;-webkit-tap-highlight-color:transparent}
.seg button[aria-selected=true],.seg button[aria-checked=true]{color:var(--t)}
.seg.sm{width:100%;max-width:340px;margin:16px 0 0}
.seg.sm button{min-height:32px;font-size:13px}

.form{display:flex;flex-direction:column;gap:12px;padding:16px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:6px}.fld span{font-size:13px;font-weight:600;color:var(--t2);padding:0 4px}
.fld input{height:48px;border-radius:16px;border:1px solid var(--gb);background:rgba(127,127,127,.1);color:inherit;font:inherit;padding:0 16px;outline:0}
.fld input:focus{border-color:var(--t2)}
.hint{font-size:13px;color:var(--t2);padding:0 4px;overflow-wrap:anywhere}

/* Country button next to the phone field */
.phone{display:flex;gap:8px}
.phone input{flex:1;min-width:0}
.cc{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 10px 0 12px;border-radius:16px;border:1px solid var(--gb);background:rgba(127,127,127,.1);color:inherit;font:inherit;font-weight:600;cursor:pointer;transition:border-color .2s}
.cc:hover{border-color:var(--t2)}
.cc b{font-weight:600;font-variant-numeric:tabular-nums}
.cc svg{width:16px;height:16px;fill:none;stroke:var(--t2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iso{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:7px;background:rgba(127,127,127,.2);font-style:normal;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--t2)}

/* Country picker sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;pointer-events:none;transition:visibility 0s .45s}
.sheet.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.sheet .sc{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.sheet.open .sc{opacity:1}
.sheet .pn{position:relative;width:min(100%,520px);max-height:min(78dvh,640px);display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--bg);border:1px solid var(--gb);box-shadow:0 -10px 40px rgba(0,0,0,.3);transform:translateY(100%);transition:transform .45s var(--spring);padding-bottom:env(safe-area-inset-bottom);outline:0}
.sheet.open .pn{transform:none}
@media(min-width:600px){.sheet{align-items:center}.sheet .pn{border-radius:28px;max-height:min(70dvh,620px);transform:translateY(24px) scale(.97);opacity:0;transition:transform .45s var(--spring),opacity .25s}.sheet.open .pn{transform:none;opacity:1}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}.ph b{font-size:18px;font-weight:700}

.px svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.ps{flex:none;margin:4px 16px 8px;height:44px;border-radius:14px;border:1px solid var(--gb);background:rgba(127,127,127,.1);color:inherit;font:inherit;padding:0 14px;outline:0}
.ps:focus{border-color:var(--t2)}
.plist{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 8px 12px}

.qrc svg{width:100%;height:100%;display:block}

 main,header{max-width:1040px}

 .qrgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
 .qrgrid .qrbox{position:sticky;top:24px;margin:0}
 .qrc{width:min(100%,340px)}
 .ctl .seg{margin-bottom:20px}

 .ctl>:last-child{margin-bottom:0}
 .seg button{min-height:40px}

 .foot{margin-top:40px}

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  el.style.setProperty('--n',n);
  const paint=()=>{el.style.setProperty('--i',cur);bs.forEach((b,i)=>{b.setAttribute(A,i===cur);b.tabIndex=i===cur?0:-1})};
  const set=i=>{i=clamp(i,0,n-1);const ch=i!==cur;cur=i;paint();if(ch)on(i)};
  const at=x=>{const r=el.getBoundingClientRect();return clamp(Math.floor((x-r.left-4)/((r.width-8)/n)),0,n-1)};

  const onGlass=e=>{const r=th.getBoundingClientRect(),m=4;return e.clientX>=r.left-m&&e.clientX<=r.right+m&&e.clientY>=r.top-m&&e.clientY<=r.bottom+m};
  el.addEventListener('pointerdown',e=>{if(e.button)return;id=e.pointerId;el.setPointerCapture(id);x0=e.clientX;mv=false;grab=onGlass(e);
    if(grab){sw=th.offsetWidth;p0=cur*sw;el.classList.add('press')}});
  el.addEventListener('pointermove',e=>{
    if(id===null){el.style.cursor=onGlass(e)?'grab':'pointer';return}   // hover (mouse): kursor tangan hanya di atas glass
    if(e.pointerId!==id||!grab)return;                                   // di luar glass: tidak bisa digeser
    const dx=e.clientX-x0;if(!mv&&Math.abs(dx)<4)return;mv=true;el.classList.add('drag');el.style.setProperty('--x',clamp(p0+dx,0,(n-1)*sw)+'px')});
  const end=(e,ok)=>{if(e.pointerId!==id)return;id=null;let i=cur;
    if(ok){if(grab)i=mv?Math.round(parseFloat(el.style.getPropertyValue('--x'))/sw):at(e.clientX);
           else if(Math.abs(e.clientX-x0)<8)i=at(e.clientX)}            // tap di luar glass: pindah ke segmen yang di-tap
    grab=false;el.classList.remove('press','drag');el.style.removeProperty('--x');set(i)};
  el.addEventListener('pointerup',e=>end(e,true));
  el.addEventListener('pointercancel',e=>end(e,false));
  el.addEventListener('click',e=>{if(e.detail===0){const b=e.target.closest('button');if(b)set(bs.indexOf(b))}});

}

// Full international digits from what the user typed (country code is added automatically)
function waNum(){
 const raw=(vals.n||'').trim(),c=cc.code;let d=raw.replace(/\D/g,'');
 if(!d)return '';
 if(raw[0]==='+')return d;
 if(d.startsWith('00'))return d.replace(/^0+/,'');
 d=d.replace(/^0+/,'');if(!d)return '';
 if(d.startsWith(c)&&d.length>=c.length+9)return d;
 if(c.length>1&&c[0]==='1'&&d.length===10&&d.startsWith(c.slice(1)))return '1'+d;

 for(let t=1;t<=40;t++){try{const q=new QRLib(t,l);q.addData(b);q.make();return q}catch(e){}}return null}

 if(text)q=enc(text,lvl);

const field=([k,l,t,p])=>`<label class="fld"><span>${l}</span><input data-k="${k}" type="${t}" placeholder="${p}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${esc(vals[k]||'')}"></label>`;
const chev='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>';
function ccBtn(){const b=$('#cc');if(b)b.innerHTML=`<i class="iso">${cc.iso}</i><b>${dial(cc)}</b>${chev}`}
function hint(){window.GlassKit?GlassKit.morph($('#form'),hint0,{fade:false}):hint0()}
function hint0(){const h=$('#wh');if(!h)return;const n=waNum();h.textContent=n?'Opens a chat with +'+n:'Type the number without the country code. A leading 0 is removed for you.'}
function fields(){const f=$('#form');window.GlassKit?GlassKit.morph(f,fields0):fields0()}
function fields0(){
 $('#form').innerHTML=mode==='wa'
  ?`<div class="fld"><span id="pl">Phone number</span><div class="phone"><button type="button" class="cc" id="cc" aria-haspopup="dialog" aria-label="Choose country code"></button><input id="pn" data-k="n" type="tel" inputmode="tel" autocomplete="off" aria-labelledby="pl" placeholder="812 3456 7890" value="${esc(vals.n||'')}"></div><small class="hint" id="wh"></small></div>`+F.wa.map(field).join('')
  :F[mode].map(field).join('');
 if(mode==='wa'){ccBtn();hint0()}}
$('#form').oninput=e=>{const k=e.target.dataset.k;if(k){vals[k]=e.target.value;if(k==='n')hint();render()}};
$('#form').onclick=e=>{if(e.target.closest('#cc'))openSheet()};

/* ---------- Country picker ---------- */
const sheet=document.createElement('div');sheet.className='sheet';
sheet.innerHTML='<div class="sc"></div><div class="pn" role="dialog" aria-modal="true" aria-label="Choose country" tabindex="-1"><div class="ph"><b>Choose country</b><button type="button" class="px" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><input class="ps" type="search" placeholder="Search country or code" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search country or code"><div class="plist" role="listbox" aria-label="Countries"></div></div>';
document.body.append(sheet);
const pn=sheet.querySelector('.pn'),ps=sheet.querySelector('.ps'),pl=sheet.querySelector('.plist');
function list(q=''){
 q=nrm(q.trim());const num=/^\+?[\d\s]+$/.test(q),dq=q.replace(/\D/g,'');
 const items=CC.filter(c=>!q||(num?c.code.startsWith(dq):c.key.includes(q)||c.iso.toLowerCase()===q));
 let h='',L='';
 for(const c of items){
  const l=c.key[0].toUpperCase();
  if(!q&&l!==L){L=l;h+=`<div class="lh">${l}</div>`}
  h+=`<button type="button" class="ci${c.iso===cc.iso?' sel':''}" role="option" aria-selected="${c.iso===cc.iso}" data-i="${c.iso}"><i class="iso">${c.iso}</i><span class="nm">${esc(c.name)}</span><b>${dial(c)}</b></button>`}
 pl.innerHTML=h||'<p class="pe">No country found.</p>'}
function openSheet(){
 ps.value='';list();
 sheet.classList.add('open');
 for(const e of [$('header'),$('main')])e.inert=true;
 document.body.style.overflow='hidden';
 const s=pl.querySelector('.sel');if(s)pl.scrollTop=s.offsetTop-pl.clientHeight/2+s.offsetHeight/2;
 (matchMedia('(pointer:fine)').matches?ps:pn).focus({preventScroll:true})}
function closeSheet(){
 if(!sheet.classList.contains('open'))return;
 sheet.classList.remove('open');
 for(const e of [$('header'),$('main')])e.inert=false;
 document.body.style.overflow='';
 const b=$('#cc');if(b)b.focus({preventScroll:true})}
function pick(iso){
 const c=CC.find(x=>x.iso===iso);if(!c)return;
 cc=c;store('qrcc',c.iso);ccBtn();hint();render();closeSheet();
 const i=$('#pn');if(i&&matchMedia('(pointer:fine)').matches)i.focus()}
pl.onclick=e=>{const b=e.target.closest('.ci');if(b)pick(b.dataset.i)};
ps.oninput=()=>list(ps.value);
ps.onkeydown=e=>{if(e.key==='Enter'){const b=pl.querySelector('.ci');if(b)pick(b.dataset.i)}};
sheet.querySelector('.sc').onclick=closeSheet;
sheet.querySelector('.px').onclick=closeSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- Sliders ---------- */
Seg($('#tabs'),0,i=>{mode=MODES[i];fields();render()});
Seg($('#ec'),1,i=>{lvl=LV[i];$('#ecn').textContent=NOTE[i];render()});
$('#ecn').textContent=NOTE[1];

/* ---------- Layout desktop: kartu Error correction pindah ke kolom kiri ---------- */
const opt=$('#opt'),mq=matchMedia('(min-width:960px)');
const place=()=>{if(mq.matches){opt.className='opt glass form';$('#ctl').append(opt)}else{opt.className='opt';$('#qb').insertBefore(opt,$('#qb .eb'))}};
mq.addEventListener('change',place);place();

/* ---------- Save ---------- */
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#ds').onclick=()=>window._svg&&save(new Blob([window._svg],{type:'image/svg+xml'}),'qr-code.svg');
$('#dp').onclick=()=>{if(!mods)return;const n=mods.length,s=n+8,k=Math.ceil(1024/s),c=document.createElement('canvas');c.width=c.height=s*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
 mods.forEach((row,r)=>row.forEach((on,i)=>on&&x.fillRect((i+4)*k,(r+4)*k,k,k)));c.toBlob(b=>save(b,'qr-code.png'),'image/png')};
fields();render();
});
</script>
</body>
</html>
