<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Create QR codes for links, text, WiFi, and WhatsApp. Free, private, no sign-up.">
<meta name="theme-color" content="#f5f5f5">
<title>GlassQR - Free QR code generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Cpath d='M16 7v13M10.500 15l5.500 5.500 5.500-5.500M9 25h14' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="canonical" href="__ORIGIN__/qr">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GlassKit">
<meta property="og:type" content="website"><meta property="og:site_name" content="GlassKit"><meta property="og:title" content="GlassQR - Free QR code generator"><meta property="og:description" content="Create QR codes for links, text, WiFi, and WhatsApp. Free, private, no sign-up."><meta property="og:url" content="__ORIGIN__/qr"><meta property="og:image" content="__ORIGIN__/og.png"><meta name="twitter:card" content="summary_large_image">
<script>
try{var s=localStorage.getItem('theme')}catch(e){}
document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')
</script>
<link rel="stylesheet" href="/base.css?v=2">
<script src="/shell.js?v=2" defer></script>
<style>
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(127,127,127,.16);margin-bottom:16px}
.seg button{flex:1;min-height:36px;padding:0 12px;border-radius:999px;background:transparent;font-size:15px;font-weight:600;color:var(--t2);transition:background-color .3s,color .3s,box-shadow .3s}
.seg button[aria-pressed=true]{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.18)}
[data-theme=dark] .seg button[aria-pressed=true]{background:rgba(255,255,255,.18);color:#f5f5f5;box-shadow:none}
.seg.sm{margin:16px 0 0}.seg.sm button{min-height:32px;font-size:13px}
.form{display:flex;flex-direction:column;gap:12px;padding:16px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:6px}.fld span{font-size:13px;font-weight:600;color:var(--t2);padding:0 4px}
.fld input{height:48px;border-radius:16px;border:1px solid var(--gb);background:rgba(127,127,127,.1);color:inherit;font:inherit;padding:0 16px;outline:0}
.fld input:focus{border-color:var(--t2)}
.qrbox{display:flex;flex-direction:column;align-items:center;padding:20px}
.qrc{width:min(100%,300px);aspect-ratio:1;border-radius:20px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#6e6e73}
.qrc svg{width:100%;height:100%;display:block}
.qrh{padding:24px;text-align:center;font-size:15px;max-width:240px}
.sub2{margin-top:12px;font-size:13px;color:var(--t2);text-align:center;max-width:340px}
.qrbox .eb{margin-top:16px;width:100%}.qrbox .eb>*{flex:1}
.seg.sm{width:100%;max-width:340px}
</style>
</head>
<body>
<header>
  <button class="mb" id="mb" aria-label="Open menu" aria-expanded="false" aria-controls="dr"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="sw" id="tsw" role="switch" aria-label="Dark mode"><span class="kn">
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </span></button>
</header>
<main>
  <h1>Create a QR code</h1>
  <p class="sub">Type or paste something, and the code updates instantly. Nothing is uploaded.</p>
  <div class="seg" role="tablist" id="tabs">
    <button role="tab" aria-pressed="true" data-m="text">Link or text</button>
    <button role="tab" aria-pressed="false" data-m="wifi">WiFi</button>
    <button role="tab" aria-pressed="false" data-m="wa">WhatsApp</button>
  </div>
  <div class="glass form" id="form"></div>
  <div class="glass qrbox">
    <div class="qrc" id="qr"><p class="qrh" id="qh">Your QR code will appear here.</p></div>
    <div class="seg sm" id="ec" aria-label="Error correction">
      <button aria-pressed="false" data-l="1">Low</button>
      <button aria-pressed="true" data-l="0">Medium</button>
      <button aria-pressed="false" data-l="2">High</button>
    </div>
    <p class="sub2" id="ecn">Higher levels still scan when the code is dirty or damaged, but look denser.</p>
    <div class="eb"><button class="btn" id="dp" disabled>Save PNG</button><button class="ghost" id="ds" disabled>Save SVG</button></div>
  </div>
  <p class="foot">The code is created on your device. Links and text are never stored.</p>
</main>
<script src="/qr-lib.js?v=2" defer></script>
<script defer>
addEventListener('DOMContentLoaded',()=>{
const $=s=>document.querySelector(s),box=$('#qr');
const F={
 text:[['v','Link or text','text','https://example.com']],
 wifi:[['s','Network name','text','My WiFi'],['p','Password','text','']],
 wa:[['n','Phone number with country code','tel','628123456789'],['m','Message (optional)','text','Hello!']]};
let mode='text',lvl=0,mods=null,vals={};
const ESC=s=>s.replace(/([\\;,:"])/g,'\\$1');
function build(){const v=vals;
 if(mode==='text')return (v.v||'').trim();
 if(mode==='wifi')return v.s?`WIFI:T:${v.p?'WPA':'nopass'};S:${ESC(v.s)};${v.p?'P:'+ESC(v.p)+';':''};`:'';
 const n=(v.n||'').replace(/\D/g,'');return n?'https://wa.me/'+n+(v.m?'?text='+encodeURIComponent(v.m):''):''}
function enc(text,l){const b=String.fromCharCode(...new TextEncoder().encode(text));
 for(let t=1;t<=40;t++){try{const q=new QRLib(t,l);q.addData(b);q.make();return q}catch(e){}}return null}
function render(){
 const text=build();let q=null;
 if(text)q=enc(text,lvl);
 $('#dp').disabled=$('#ds').disabled=!q;
 if(!q){mods=null;box.innerHTML=text?'<p class="qrh">That is too long for a QR code. Try something shorter.</p>':'<p class="qrh">Your QR code will appear here.</p>';return}
 const n=q.getModuleCount();mods=[];let d='';
 for(let r=0;r<n;r++){let run=0;mods.push([]);for(let c=0;c<=n;c++){const on=c<n&&q.isDark(r,c);if(c<n)mods[r].push(on);if(on)run++;else if(run){d+=`M${c-run+4} ${r+4}h${run}v1h-${run}z`;run=0}}}
 const s=n+8;window._svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
 box.innerHTML=window._svg;box.firstChild.setAttribute('role','img');box.firstChild.setAttribute('aria-label','QR code')}
function fields(){$('#form').innerHTML=F[mode].map(([k,l,t,p])=>`<label class="fld"><span>${l}</span><input data-k="${k}" type="${t}" placeholder="${p}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${(vals[k]||'').replace(/"/g,'&quot;')}"></label>`).join('')}
$('#form').oninput=e=>{if(e.target.dataset.k){vals[e.target.dataset.k]=e.target.value;render()}};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));fields();render()};
$('#ec').onclick=e=>{const b=e.target.closest('button');if(!b)return;lvl=+b.dataset.l;document.querySelectorAll('#ec button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#ds').onclick=()=>window._svg&&save(new Blob([window._svg],{type:'image/svg+xml'}),'qr-code.svg');
$('#dp').onclick=()=>{if(!mods)return;const n=mods.length,s=n+8,k=Math.ceil(1024/s),c=document.createElement('canvas');c.width=c.height=s*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
 mods.forEach((row,r)=>row.forEach((on,i)=>on&&x.fillRect((i+4)*k,(r+4)*k,k,k)));c.toBlob(b=>save(b,'qr-code.png'),'image/png')};
fields();render();
});
</script>
</body>
</html>
