<script>
const L={en:{doc:'GlassGrab - Download videos from any link',h1:'Download videos from any link',sub:'Works with YouTube, Instagram, TikTok, Facebook, X, and thousands more. No ads, no sign-up.',ph:'Paste a video link',paste:'Paste',go:'Get video',empty:'Paste a link to get started.',foot:'For content you own, are licensed to use, or need for personal use. Links and files are never stored.',av:'Video with audio',avh:'Plays everywhere',vo:'Video only',voh:'Best audio is added automatically',ao:'Audio only',aoh:'Just the sound',upto:'Up to ',one:'1 format',many:' formats',aud:'audio',best:'Best quality',compat:'Most compatible',small:'Smallest size',unk:'Size unknown',prep:'Preparing…',started:'Download started · ',clip:'Clipboard access is off. Paste the link manually.',look:'Finding your video…',wait:'Fetching details and formats. This usually takes a few seconds.',wait2:'One moment. Your file is still being prepared.',slow:'Still working. The server is waking up, which can take a moment.'}};
const $=s=>document.querySelector(s),u=$('#u'),out=$('#out'),tt=$('#t');
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const lang='en';let cur=null,lastErr=null;
const t=k=>L[lang][k];
const pickUrl=s=>{const m=String(s||'').match(/https?:\/\/[^\s<>"']+/i);return m?m[0].replace(/[)\]}.,;:!?]+$/,''):''}; // ambil link dari teks share (TikTok/IG menyalin teks + link)
const sites={youtu:'YouTube',instagram:'Instagram',facebook:'Facebook','fb.':'Facebook',tiktok:'TikTok','x.com':'X',twitter:'X',reddit:'Reddit',vimeo:'Vimeo',twitch:'Twitch'};
const IC={
YouTube:'<svg viewBox="0 0 24 24"><rect x="1.5" y="5" width="21" height="14" rx="4.2" fill="#f03"/><path d="M10 9l5.200 3-5.200 3z" fill="#fff"/></svg>',
Instagram:'<svg viewBox="0 0 24 24"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".65" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/><rect x="6.2" y="6.2" width="11.6" height="11.6" rx="3.800" fill="none" stroke="#fff" stroke-width="1.700"/><circle cx="12" cy="12" r="2.800" fill="none" stroke="#fff" stroke-width="1.700"/><circle cx="16.100" cy="7.900" r=".9" fill="#fff"/></svg>',
Facebook:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1877f2"/><path d="M13.500 22v-7.600h2.500l.4-3h-2.900V9.600c0-.9.300-1.500 1.500-1.500h1.500V5.400c-.3 0-1.200-.1-2.200-.1-2.200 0-3.700 1.300-3.700 3.800v2.300H8v3h2.600V22z" fill="#fff"/></svg>',
X:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="#000" stroke="#fff" stroke-opacity=".3"/><path d="M7 6.500l10 11M17 6.500L7 17.500" stroke="#fff" stroke-width="1.900" stroke-linecap="round"/></svg>',
TikTok:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="#000" stroke="#fff" stroke-opacity=".3"/><g fill="none" stroke-width="1.900" stroke-linecap="round"><path id="tn" d="M12.800 6.500v8.200a2.400 2.400 0 1 1-2.400-2.400M12.800 6.500c.4 2 1.800 3.200 4 3.400" stroke="#25f4ee" transform="translate(-.7 -.5)"/><path d="M12.800 6.500v8.200a2.400 2.400 0 1 1-2.400-2.400M12.800 6.500c.4 2 1.800 3.200 4 3.400" stroke="#fe2c55" transform="translate(.7 .5)"/><path d="M12.800 6.500v8.200a2.400 2.400 0 1 1-2.400-2.400M12.800 6.500c.4 2 1.800 3.200 4 3.400" stroke="#fff"/></g></svg>',
Reddit:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff4500"/><ellipse cx="12" cy="13.400" rx="5.600" ry="3.800" fill="#fff"/><circle cx="9.800" cy="13" r="1" fill="#ff4500"/><circle cx="14.200" cy="13" r="1" fill="#ff4500"/><circle cx="16.500" cy="7.500" r="1.100" fill="#fff"/><path d="M12 9.600l.9-3.200 3.200.8" fill="none" stroke="#fff" stroke-width="1.100"/></svg>',
Vimeo:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="#1ab7ea"/><path d="M6.500 10l1 1c1-.8 1.700-.5 2 .5l1.200 4.300c.4 1.200 1.200 1.200 2.200.3 1.800-1.500 3.300-3.300 3.400-5 .1-1.500-1-2-2.100-1.700-1 .3-1.700 1-2 2.200" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></svg>',
Twitch:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="#9146ff"/><path d="M6.500 5.500h11v7.500l-3 3h-2.500l-2 2v-2H6.500z" fill="#fff"/><path d="M11 8.500v3M14.500 8.500v3" stroke="#9146ff" stroke-width="1.500" stroke-linecap="round"/></svg>',
Link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/></svg>'};
const site=s=>(Object.entries(sites).find(([k])=>s.includes(k))||[])[1]||(s.startsWith('http')?'Link':'');
const MB=(n,ex)=>!n?t('unk'):(ex?'':'~')+(n>=1e9?(n/1e9).toFixed(2)+' GB':n<1e7?Math.max(.1,n/1e6).toFixed(1)+' MB':Math.round(n/1e6)+' MB');
const T=s=>s?[Math.floor(s/3600),Math.floor(s/60)%60,Math.floor(s%60)].filter((x,i)=>i||x).map((x,i)=>i?String(x).padStart(2,'0'):x).join(':'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(m,ms=3800)=>{GlassKit.blend(tt,m,tt.classList.contains('on'));tt.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>tt.classList.remove('on'),ms)};

const main=$('main'),tsw=$('#tsw'),dark=()=>document.documentElement.dataset.theme==='dark';
function sync(){tsw.classList.toggle('on',dark());tsw.setAttribute('aria-checked',dark())}
function apply(){
  document.documentElement.lang=lang;document.title=t('doc');u.placeholder=t('ph');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  out.classList.remove('anim');
  if(cur)show(cur);else if(lastErr)fail(lastErr);
  sync();
}
function theme(v){
  document.documentElement.dataset.theme=v;store('theme',v);
  $('meta[name=theme-color]').content=v==='dark'?'#0a0a0a':'#f5f5f5';sync();
}
function sw(el,get,set){
  let id=null,x0=0,p0=0,trv=0,mv=false;
  el.addEventListener('pointerdown',e=>{if(e.button)return;id=e.pointerId;el.setPointerCapture(id);x0=e.clientX;trv=el.offsetWidth-44;p0=get()?trv:0;mv=false;clearTimeout(el._t);el.classList.add('press')});
  el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const dx=e.clientX-x0;if(!mv&&Math.abs(dx)<4)return;mv=true;el.classList.add('drag');el.style.setProperty('--x',Math.max(0,Math.min(trv,p0+dx))+'px')});
  const end=(e,ok)=>{if(e.pointerId!==id)return;id=null;let v=get();
    if(ok)v=mv?parseFloat(el.style.getPropertyValue('--x'))>trv/2:!v;
    el.classList.remove('drag');el.style.removeProperty('--x');clearTimeout(el._t);if(v!==get()){el._t=setTimeout(()=>el.classList.remove('press'),180);set(v)}else el.classList.remove('press')};
  el.addEventListener('pointerup',e=>end(e,true));el.addEventListener('pointercancel',e=>end(e,false));
  el.addEventListener('click',e=>{if(e.detail===0)set(!get())});
}
sw(tsw,dark,v=>theme(v?'dark':'light'));

const RK='recent',recents=()=>{try{return JSON.parse(store(RK)||'[]')}catch(e){return[]}};
function remember(url,title){const l=recents().filter(x=>x.u!==url);l.unshift({u:url,t:title||url});store(RK,JSON.stringify(l.slice(0,4)))}
function emptyHTML(){const l=recents();
  return '<p class="empty">'+t('empty')+'</p>'+(l.length?'<div class="rch"><b>Recent</b><button class="rcx" type="button">Clear history</button></div>'+l.map(x=>{const s=site(x.u);return `<button class="rc" type="button" data-u="${esc(x.u)}">${IC[s]||IC.Link}<span><b>${esc(x.t)}</b><small>${esc(s||'Link')}</small></span></button>`}).join(''):'')}
const stp=n=>[...$('#st').children].forEach((l,i)=>l.className=i+1<n?'done':i+1===n?'on':'');
const M=(e,f,o)=>window.GlassKit?GlassKit.morph(e,f,o):f();
const put=h=>{stp(/glass pv"/.test(h)?2:1);out.classList.remove('anim');M(out,()=>{out.innerHTML=h},{fade:false});void out.offsetWidth;out.classList.add('anim');clearTimeout(put.t);put.t=setTimeout(()=>out.classList.remove('anim'),1300)}; // animasi masuk cukup sekali; lepas kelasnya supaya tidak terulang saat tombol ditekan
const ER={
BOT:{title:'YouTube is blocking our server',why:'YouTube sometimes blocks requests that come from data centers, even for public videos.',tip:'Try again later, or try a video from another platform.',retry:1},
BAD_URL:{title:"That doesn't look like a valid link",why:'The link may be cut off or mistyped.',tip:'Copy the full link from the app or browser, then paste it again.'},
ADDR:{title:"This address can't be used",why:'Links to private or local addresses are blocked for safety.',tip:'Use a public video link instead.'},
PRIVATE:{title:'This video is private',why:'It needs a login, or only certain people can watch it.',tip:'Try a public video, or one you can open without signing in.'},
UNSUPPORTED:{title:"This link isn't supported yet",why:"We couldn't find a video on this page.",tip:'Make sure the link opens a video, not a profile or search page.'},
UNAVAILABLE:{title:"This video isn't available",why:'It may have been deleted, or it is blocked in some regions.',tip:'Check that it still plays in your browser.'},
RATE:{title:'Too many requests',why:'The platform or server needs a short break.',tip:'Wait a minute, then try again.',retry:1},
TOO_BIG:{title:'This file is too large',why:"This server can't prepare files that big.",tip:'Pick a lower quality, or choose audio only.'},
BAD_FORMAT:{title:"That format isn't available",why:'The list may be out of date.',tip:'Look up the link again and choose another format.'},
BUSY:{title:'The server is busy',why:'Other downloads are running right now.',tip:'Try again in a few seconds.',retry:1},
EXPIRED:{title:'This file has expired',why:'Prepared files are removed after a few minutes.',tip:'Tap the format again to prepare a new one.'},
FAILED:{title:"Couldn't process this video",why:'Something went wrong while reading it.',tip:'Try again, or pick a different format.',retry:1}};
const NET={title:'No connection',why:"We couldn't reach the server.",tip:'Check your internet connection, then try again.',retry:1};
const GEN={title:'Something went wrong',why:'An unexpected error happened on our side.',tip:'Try again in a moment.',retry:1};
const explain=e=>{if(!e)return GEN;if(e instanceof TypeError||/failed to fetch|load failed|network/i.test(e.message))return NET;
 return ER[e.code]||(e.status===429?ER.RATE:GEN)};
const fail=e=>{lastErr=e;const x=explain(e);
  put(`<div class="glass err" role="alert"><div class="eic"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 16.5v.01"/><path d="M10.300 4.500L3.500 17a2 2 0 0 0 1.700 3h13.600a2 2 0 0 0 1.700-3L13.700 4.500a2 2 0 0 0-3.400 0z"/></svg></div><b>${x.title}</b><p>${x.why}</p><p class="tip">${x.tip}</p><div class="eb">${x.retry?'<button class="btn" id="rt">Try again</button>':''}<button class="ghost" id="cl">Clear link</button></div></div>`);
  const r=$('#rt');if(r)r.onclick=()=>load();$('#cl').onclick=()=>xb.click()};
const infoCache=new Map();let slowT;
function loading(){
  put(`<div class="glass pv skl"><div class="th"></div><div class="info"><i></i><i></i><i class="s"></i></div></div><div class="glass sk"><div class="spin"></div><b>${t('look')}</b><small id="lw">${t('wait')}</small></div>`);
  clearTimeout(slowT);slowT=setTimeout(()=>{const e=$('#lw');if(e)GlassKit.blend(e,t('slow'))},7000);
  lock(true);
}
function done(){clearTimeout(slowT);lock(false)}
const xb=$('#x'),gh=$('#p');
function lock(v){$('#go').disabled=xb.disabled=gh.disabled=u.readOnly=v}
async function load(){
  if($('#go').disabled)return;
  let url=pickUrl(u.value)||u.value.trim();if(url!==u.value.trim()){u.value=url;u.oninput()}
  if(url&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(url)&&/^[^\s\/]+\.[^\s\/]{2,}(\/|$|\?)/.test(url)){url='https://'+url.replace(/^\/+/,'');u.value=url;u.oninput()}
  if(!/^https?:\/\//i.test(url)){const b=$('.bar');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return say("That doesn't look like a link. Paste the full address, starting with http or https.",4500)}
  cur=lastErr=null;loading();
  try{
    const c=infoCache.get(url);let d;
    if(c&&Date.now()-c.t<3e5)d=c.d; // link sama dalam 5 menit: tanpa permintaan baru ke server
    else{const r=await fetch('/api/info?url='+encodeURIComponent(url));d=await r.json();
      if(!r.ok)throw Object.assign(Error(d.error),{status:r.status,code:d.code});infoCache.set(url,{d,t:Date.now()})}
    cur=d;show(d);remember(url,d.title);
  }catch(e){fail(e)}finally{done()}
}

function show(d){
  const by=k=>d.formats.filter(f=>f.k===k),key=f=>f.h*1e4+f.br,desc=(x,y)=>key(y)-key(x);
  const av=by('av').sort(desc),v=by('v').sort(desc),a=by('a').sort((x,y)=>y.br-x.br);
  const vid=[...av,...v].sort(desc);
  const best=vid[0],compat=vid.find(f=>f.vc==='H.264'&&f.ext==='mp4'),small=av.filter(f=>f.size).sort((x,y)=>x.size-y.size)[0];
  const tag=f=>f===best?t('best'):f===compat?t('compat'):f===small?t('small'):'';
  const rate=n=>n>=1000?(n/1e3).toFixed(1)+' Mbps':n+' kbps';
  const card=(f,i)=>{
    const main=f.h?f.h+'p'+(f.fps>30?f.fps:''):f.ext.toUpperCase(),end=f.h?f.ext.toUpperCase():(f.br?rate(f.br):t('aud').toUpperCase());
    const chips=[[f.vc,f.ac].filter(x=>x&&x!==f.ext.toUpperCase()).join(' + '),f.h&&f.br?rate(f.br):'',MB(f.size,f.ex)].filter(Boolean).map(x=>`<i>${esc(x)}</i>`).join('')+(f.hdr?'<i class="hd">HDR</i>':'');
    return `<button class="fmt" style="--n:${Math.min(i,10)}" data-f="${esc(f.id)}" data-k="${f.k}" data-e="${f.ext}">${tag(f)?`<span class="tag">${tag(f)}</span>`:''}<b>${main}<em>${end}</em></b><span class="m">${chips}</span></button>`};
  const sec=(h,hint,l)=>l.length?`<div class="sh"><h2>${h}</h2><span>${hint}</span></div><div class="grid">${l.map(card).join('')}</div>`:'';
  const src=site(u.value.trim()),n=d.formats.length;
  const sum=[best&&best.h?t('upto')+best.h+'p':'',n===1?t('one'):n+t('many')].filter(Boolean).map(x=>`<i>${esc(x)}</i>`).join('');
  put(`<div class="glass pv"><div class="th">${d.thumb?`<img src="${esc(d.thumb)}" alt="" referrerpolicy="no-referrer">`:''}${d.dur?`<span class="dur">${T(d.dur)}</span>`:''}</div><div class="info">${src?`<span class="src">${IC[src]||IC.Link}${esc(src)}</span>`:''}<b>${esc(d.title)}</b>${d.who?`<small>${esc(d.who)}</small>`:''}<span class="m">${sum}</span></div></div>`
    +sec(t('av'),t('avh'),av)+sec(t('vo'),t('voh'),v)+sec(t('ao'),t('aoh'),a));
}

out.onclick=async ev=>{
  const rc=ev.target.closest('.rc');
  if(rc){u.value=rc.dataset.u;u.oninput();return load()}
  if(ev.target.closest('.rcx')){store('recent','[]');return put(emptyHTML())}
  const b=ev.target.closest('.fmt');
  if(out.dataset.busy){if(b&&b.getAttribute('aria-disabled')==='true')say(t('wait2'));return}
  if(!b)return;
  out.dataset.busy=1;
  // semua opsi lain diredupkan + kolom link dikunci: jelas bahwa sekarang harus menunggu
  out.querySelectorAll('.fmt').forEach(x=>{if(x!==b)x.setAttribute('aria-disabled','true')});lock(true);
  const {f,k,e}=b.dataset,old=b.innerHTML,t0=Date.now();
  b.disabled=true;b.classList.add('busy');
  M(b,()=>{b.innerHTML=`<b>${t('prep')}<em class="el">0:00</em></b><span class="pgb"><i></i></span><span class="hint">Keep this page open.</span>`},{fade:false});
  const tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000),el=b.querySelector('.el');if(!el)return;el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s===12)b.querySelector('.hint').textContent='Larger files can take a minute or more. Keep this page open.'},1000);
  try{
    const r=await fetch(`/api/prepare?url=${encodeURIComponent(u.value.trim())}&f=${encodeURIComponent(f)}&k=${k}&e=${e}`),d=await r.json();
    if(!r.ok)throw Object.assign(Error(d.error),{status:r.status,code:d.code});
    const l=document.createElement('a');l.href='/api/file/'+d.token;l.download=d.name;l.click();
    stp(3);say(t('started')+MB(d.size,true));b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),2600);
  }catch(x){const e2=explain(x);say(e2.title+'. '+e2.tip,5200)}
  finally{clearInterval(tick);delete out.dataset.busy;out.querySelectorAll('.fmt[aria-disabled]').forEach(x=>x.removeAttribute('aria-disabled'));lock(false);b.classList.remove('busy');M(b,()=>{b.innerHTML=old},{fade:false});b.disabled=false}
};


u.oninput=()=>{const b=$('#bd'),v=u.value.trim(),x=site(v);
  if(x){b.innerHTML=IC[x]||IC.Link;b.setAttribute('aria-label',x);b.title=x;b.classList.remove('hide')}else b.classList.add('hide');
  xb.classList.toggle('hide',!v);gh.classList.toggle('hide',!!v)};
xb.onclick=()=>{if(xb.disabled)return;u.value='';cur=lastErr=null;clearTimeout(slowT);u.oninput();put(emptyHTML());u.focus()};
u.onpaste=e=>{const x=(e.clipboardData||window.clipboardData).getData('text'),l=pickUrl(x);if(l&&l!==x.trim()){e.preventDefault();u.value=l} // input type=url membuang baris baru, jadi ambil link sebelum disisipkan
  setTimeout(()=>{u.oninput();load()},60)};
u.onkeydown=e=>{if(e.key==='Enter')load()};
$('#go').onclick=load;
$('#p').onclick=async()=>{try{const x=await navigator.clipboard.readText();u.value=pickUrl(x)||x.trim();u.oninput();load()}catch{say(t('clip'))}};
theme(document.documentElement.dataset.theme);apply();put(emptyHTML());requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.add('ready')));
const q=new URLSearchParams(location.search),pre=q.get('url')||q.get('text');
if(pre){u.value=pickUrl(pre)||pre.trim();u.oninput();load()}
</script>
